<script>
(function () {
  'use strict';

  // ---- 辞書・固定の一覧（サーバから埋め込み） ----
  var I18N_DATA = <?!= JSON.stringify(I18N) ?>;
  var PREFECTURES = <?!= JSON.stringify(PREFECTURES_) ?>;
  var currentLang = 'ja';

  // 訳が無ければ日本語、日本語も無ければ空文字（キー名をそのまま画面に出さない）
  function t(key) {
    return (I18N_DATA[currentLang] && I18N_DATA[currentLang][key]) ||
           (I18N_DATA.ja && I18N_DATA.ja[key]) || '';
  }
  function tErr(code) { return t('error.' + code) || t('error.INTERNAL'); }

  // ---- アプリの状態（トークンはこの変数にだけ持つ） ----
  var state = {
    token: null, role: null, studentId: null, adminToken: null,
    yearMonth: null, monthData: null, workplaces: [],
    admin: { settings: null, boardRows: [] }
  };

  // ---- 小道具 ----
  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function jstNow() {
    var d = new Date(Date.now() + 9 * 3600 * 1000);
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  }
  function todayYm() { return jstNow().slice(0, 7); }
  function addMonth(ym, delta) {
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + delta;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return y + '-' + pad2(m + 1);
  }
  function daysInMonth(ym) { return new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 0)).getUTCDate(); }
  // 曜日は日付から計算する（2026-10-01 は木曜）
  var DOW = { ja: ['日', '月', '火', '水', '木', '金', '土'], ne: ['आइत', 'सोम', 'मंगल', 'बुध', 'बिही', 'शुक्र', 'शनि'], vi: ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'] };
  function dowIndex(dateStr) { return new Date(Date.UTC(+dateStr.slice(0, 4), +dateStr.slice(5, 7) - 1, +dateStr.slice(8, 10))).getUTCDay(); }
  function hm(min) { min = +min || 0; return Math.floor(min / 60) + ':' + pad2(min % 60); }
  function yen(n) { return '¥' + (+n || 0).toLocaleString('ja-JP'); }

  function showScreen(name) {
    ['login-screen', 'change-password-screen', 'student-screen', 'admin-screen'].forEach(function (s) {
      el(s).hidden = s !== name;
    });
  }
  function showMsg(elId, text, isError) {
    var target = el(elId);
    if (!target) return;
    target.textContent = text;
    target.className = isError ? 'error-msg' : 'info-msg';
    target.hidden = !text;
  }
  function showError(elId, code) { showMsg(elId, tErr(code), true); }
  function hideError(elId) { var x = el(elId); if (x) x.hidden = true; }
  function showSpinner() { el('global-spinner').hidden = false; }
  function hideSpinner() { el('global-spinner').hidden = true; }

  // ---- サーバ呼び出し（通信失敗・BUSY は 2秒・4秒・8秒待って最大3回やり直す） ----
  function callServer(fn, args) {
    var delays = [2000, 4000, 8000];
    return new Promise(function (resolve) {
      function attempt(n) {
        var runner = google.script.run
          .withSuccessHandler(function (result) {
            if (result && result.ok === false && result.error === 'BUSY' && n < delays.length) {
              setTimeout(function () { attempt(n + 1); }, delays[n]);
            } else {
              resolve(result || { ok: false, error: 'INTERNAL' });
            }
          })
          .withFailureHandler(function () {
            if (n < delays.length) setTimeout(function () { attempt(n + 1); }, delays[n]);
            else resolve({ ok: false, error: 'BUSY' });
          });
        runner[fn].apply(runner, args);
      }
      attempt(0);
    });
  }
  // スピナー付き。セッション切れならログイン画面に戻す。
  function call(fn, args) {
    showSpinner();
    return callServer(fn, args).then(function (res) {
      hideSpinner();
      if (res && res.error === 'AUTH_REQUIRED' && fn !== 'api_login') {
        resetState();
        showScreen('login-screen');
        showError('login-error', 'AUTH_REQUIRED');
      }
      return res;
    });
  }
  function resetState() {
    state.token = null; state.role = null; state.studentId = null; state.adminToken = null;
    state.monthData = null; state.workplaces = [];
    el('btn-back-admin').hidden = true;
  }

  // ---- 言語 ----
  function applyLang() {
    document.querySelectorAll('[data-i18n]').forEach(function (e) {
      var v = t(e.getAttribute('data-i18n'));
      if (v) e.textContent = v;
    });
    document.querySelectorAll('.lang-switch button').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
    });
    if (state.monthData && !el('student-screen').hidden) renderStudent();
  }
  document.querySelectorAll('.lang-switch button').forEach(function (btn) {
    btn.addEventListener('click', function () { currentLang = btn.getAttribute('data-lang'); applyLang(); });
  });

  // ---- ログイン・パスワード変更・ログアウト ----
  function afterLogin() {
    state.yearMonth = todayYm();
    if (state.role === 'admin') {
      currentLang = 'ja';
      applyLang();
      showScreen('admin-screen');
      loadAdminBoard();
    } else {
      showScreen('student-screen');
      loadStudentMonth();
    }
  }

  el('btn-login').addEventListener('click', function () {
    hideError('login-error');
    var loginId = el('inp-loginId').value.trim();
    var password = el('inp-password').value;
    if (!loginId || !password) return;
    call('api_login', [loginId, password]).then(function (res) {
      if (!res.ok) { showError('login-error', res.error); return; }
      el('inp-password').value = '';
      state.token = res.data.token;
      state.role = res.data.role;
      state.studentId = res.data.studentId;
      if (res.data.mustChangePassword) showScreen('change-password-screen');
      else afterLogin();
    });
  });

  el('btn-change-password').addEventListener('click', function () {
    hideError('change-password-error');
    call('api_changePassword', [state.token, el('inp-cur-password').value, el('inp-new-password').value]).then(function (res) {
      if (!res.ok) { showError('change-password-error', res.error); return; }
      el('inp-cur-password').value = '';
      el('inp-new-password').value = '';
      afterLogin();
    });
  });

  function doLogout() {
    if (state.token) callServer('api_logout', [state.token]);
    if (state.adminToken) callServer('api_logout', [state.adminToken]);
    resetState();
    showScreen('login-screen');
  }
  el('btn-logout-st').addEventListener('click', doLogout);
  el('btn-logout-admin').addEventListener('click', doLogout);

  // =====================================================================
  // 学生画面
  // =====================================================================
  el('btn-prev-month').addEventListener('click', function () { state.yearMonth = addMonth(state.yearMonth, -1); loadStudentMonth(); });
  el('btn-next-month').addEventListener('click', function () { state.yearMonth = addMonth(state.yearMonth, 1); loadStudentMonth(); });

  // 勤務先と月のデータがそろってから描く（片方だけで描くと勤務先の選択肢が空になり、保存でシフトが消える）
  function loadStudentMonth() {
    el('st-year-month').textContent = state.yearMonth;
    hideError('shift-error');
    hideError('actual-error');
    Promise.all([
      call('api_getMonth', [state.token, state.yearMonth]),
      call('api_listWorkplaces', [state.token])
    ]).then(function (results) {
      var month = results[0], wps = results[1];
      if (!month.ok) { showError('shift-error', month.error); return; }
      if (!wps.ok) { showError('shift-error', wps.error); return; }
      state.monthData = month.data;
      state.workplaces = wps.data;
      if (month.data.student) {
        el('st-name').textContent = month.data.student.name + ' (' + month.data.student.studentId + ')';
      }
      renderStudent();
    });
    call('api_getHistory', [state.token]).then(function (res) { if (res.ok) renderHistory(res.data); });
  }

  function renderStudent() {
    renderWorkplaces();
    renderShifts();
    renderActual();
  }

  function workplaceOptions(selected) {
    var html = '<option value="">— ' + esc(t('label.selectWorkplace')) + ' —</option>';
    state.workplaces.forEach(function (wp) {
      html += '<option value="' + esc(wp.workplaceId) + '"' + (selected === wp.workplaceId ? ' selected' : '') + '>' + esc(wp.name) + '</option>';
    });
    return html;
  }

  function shiftRowHtml(day, sh, calc, disabled, cls) {
    var dis = disabled ? ' disabled' : '';
    var html = '<div class="shift-row ' + (cls || '') + '" data-day="' + day + '">';
    html += '<select class="wp-select"' + dis + '>' + workplaceOptions(sh.workplace) + '</select>';
    html += '<div class="shift-row-inputs">';
    html += '<input type="time" class="sh-start" step="900" value="' + esc(sh.start || '') + '"' + dis + '>';
    html += '<span class="shift-row-sep">〜</span>';
    html += '<input type="time" class="sh-end" step="900" value="' + esc(sh.end || '') + '"' + dis + '>';
    html += '</div>';
    html += '<div class="shift-row-calc">' + calcHtml(calc) + '</div>';
    if (!disabled) {
      html += '<div class="shift-row-footer"><button type="button" class="btn-del-row">' + esc(t('button.deleteRow')) + '</button></div>';
    }
    html += '</div>';
    return html;
  }

  // 休憩・実働・深夜・予定給与（サーバの計算結果の表示だけ。入力を変えたら保存まで空欄）
  function calcHtml(c) {
    if (!c) return '';
    return '<span>' + esc(t('label.break')) + ' ' + esc(c.breakMinutes) + '</span>' +
      '<span>' + esc(t('label.workMinutes')) + ' ' + esc(hm(c.workMinutes)) + '</span>' +
      '<span>' + esc(t('label.nightMinutes')) + ' ' + esc(hm(c.nightMinutes)) + '</span>' +
      '<span>' + esc(t('label.estimatedSalary')) + ' ' + esc(yen(c.salaryYen)) + '</span>';
  }

  function codesHtml(codes) {
    if (!codes || !codes.length) return '';
    var seen = {};
    var words = [];
    codes.forEach(function (c) {
      if (seen[c.code]) return;
      seen[c.code] = true;
      words.push('<span class="badge ' + (c.severity === 'block' ? 'badge-error' : 'badge-draft') + '">' + esc(tErr(c.code)) + '</span>');
    });
    return '<div class="codes-bar">' + words.join(' ') + '</div>';
  }

  function dayCodes(codes, dateStr) {
    return (codes || []).filter(function (c) { return c.date === dateStr; });
  }

  function renderShifts() {
    var data = state.monthData;
    if (!data) return;
    var closed = !!data.closed || data.status === '学校確定';
    var holidays = data.holidays || [];
    var shifts = data.shifts || {};
    var ev = data.evaluation || { shifts: {}, codes: [] };
    var days = daysInMonth(data.yearMonth);

    el('st-deadline-info').textContent = t('label.deadline') + ': ' + (data.deadlineAt || '—');
    el('st-closed-notice').hidden = !closed;
    el('st-closed-notice').textContent = closed ? t('label.closed') : '';
    el('btn-save-draft').disabled = closed;
    el('btn-confirm-shift').disabled = closed;
    el('st-codes').innerHTML = (data.status === '確定済' ? '<div class="badge badge-confirmed">' + esc(t('label.confirmedDone')) + '</div>' : '') +
      codesHtml((ev.codes || []).filter(function (c) { return c.severity !== 'admin'; }));

    var html = '';
    for (var d = 1; d <= days; d++) {
      var dateStr = data.yearMonth + '-' + pad2(d);
      var isHoliday = holidays.indexOf(dateStr) >= 0;
      var di = dowIndex(dateStr);
      var dowClass = di === 0 ? 'dow-sun' : (di === 6 ? 'dow-sat' : 'dow-weekday');
      var list = shifts[String(d)] || [];
      var calcs = (ev.shifts && ev.shifts[String(d)]) || [];

      html += '<div class="day-card' + (isHoliday ? ' holiday-day' : '') + '" data-day="' + d + '">';
      html += '<div class="day-header"><div class="day-title-group">';
      html += '<span class="day-num">' + d + '</span>';
      html += '<span class="day-dow ' + dowClass + '">(' + esc((DOW[currentLang] || DOW.ja)[di]) + ')</span>';
      html += '</div>';
      if (isHoliday) html += '<span class="badge badge-holiday">' + esc(t('label.holiday')) + '</span>';
      html += '</div>';
      html += codesHtml(dayCodes(ev.codes, dateStr).filter(function (c) { return c.severity !== 'admin'; }));
      var rows = list.length ? list : (closed ? [] : [{}]);
      rows.forEach(function (sh, i) { html += shiftRowHtml(d, sh, calcs[i], closed, 'plan-row'); });
      if (!closed) {
        html += '<div class="day-card-actions"><button type="button" class="btn-add-row" data-day="' + d + '">＋ ' + esc(t('button.addRow')) + '</button></div>';
      }
      html += '</div>';
    }
    el('shifts-table').innerHTML = html;
  }

  // 行の追加・削除と、入力を変えたときの計算欄の消去（予定・実績の両方）
  function wireRows(containerId, rowClass) {
    el(containerId).addEventListener('click', function (ev) {
      var add = ev.target.closest('.btn-add-row');
      if (add) {
        var card = add.closest('.day-card');
        if (card.querySelectorAll('.shift-row').length >= 10) return;
        var tmp = document.createElement('div');
        tmp.innerHTML = shiftRowHtml(add.getAttribute('data-day'), {}, null, false, rowClass);
        add.parentElement.before(tmp.firstChild);
        return;
      }
      var del = ev.target.closest('.btn-del-row');
      if (del) { var row = del.closest('.shift-row'); if (row) row.remove(); }
    });
    el(containerId).addEventListener('input', function (ev) {
      var row = ev.target.closest('.shift-row');
      if (row) row.querySelector('.shift-row-calc').innerHTML = '';
    });
  }
  wireRows('shifts-table', 'plan-row');
  wireRows('actual-table', 'actual-shift-row');

  // 入力途中の行（勤務先・開始・終了のどれかだけ入った行）もサーバへ送り、「入力不足」で止めてもらう。
  // 何も入っていない行だけを捨てる。
  function collectRows(containerId, rowClass) {
    var result = {};
    el(containerId).querySelectorAll('.' + rowClass).forEach(function (row) {
      var sh = {
        workplace: row.querySelector('.wp-select').value,
        start: row.querySelector('.sh-start').value,
        end: row.querySelector('.sh-end').value
      };
      if (!sh.workplace && !sh.start && !sh.end) return;
      var day = row.getAttribute('data-day');
      (result[day] = result[day] || []).push(sh);
    });
    return result;
  }

  function handleSaveResult(res, errId, msgKey) {
    if (!res.ok) {
      var codes = res.details ? (res.details.inputErrors || []).concat(res.details.codes || []) : [];
      showMsg(errId, tErr(res.error) + (codes.length ? '：' + codes.map(function (c) { return tErr(c.code); })
        .filter(function (v, i, a) { return a.indexOf(v) === i; }).join('、') : ''), true);
      return false;
    }
    showMsg(errId, t(msgKey), false);
    return true;
  }

  el('btn-save-draft').addEventListener('click', function () {
    hideError('shift-error');
    call('api_saveDraft', [state.token, state.yearMonth, collectRows('shifts-table', 'plan-row'), state.monthData.version]).then(function (res) {
      if (handleSaveResult(res, 'shift-error', 'label.saved')) reloadKeepMessage();
    });
  });

  el('btn-confirm-shift').addEventListener('click', function () {
    hideError('shift-error');
    call('api_confirm', [state.token, state.yearMonth, collectRows('shifts-table', 'plan-row'), state.monthData.version]).then(function (res) {
      if (handleSaveResult(res, 'shift-error', 'label.confirmedDone')) reloadKeepMessage();
    });
  });

  // 保存後に読み直して、計算結果と version を最新にする（メッセージは残す）
  function reloadKeepMessage() {
    call('api_getMonth', [state.token, state.yearMonth]).then(function (res) {
      if (!res.ok) return;
      state.monthData = res.data;
      renderShifts();
      renderActual();
    });
    call('api_getHistory', [state.token]).then(function (res) { if (res.ok) renderHistory(res.data); });
  }

  // ---- 実績確認 ----
  function renderActual() {
    var data = state.monthData;
    if (!data || !data.actual || !data.actual.open) { el('actual-section').hidden = true; return; }
    el('actual-section').hidden = false;
    var actual = data.actual;
    var plan = data.shifts || {};
    var base = actual.shifts || plan;
    var aev = actual.evaluation || { shifts: {}, codes: [] };
    var days = daysInMonth(data.yearMonth);

    el('actual-codes').innerHTML = '<div class="badge badge-draft">' + esc(actualStatusText(actual.status)) + '</div>' +
      codesHtml((aev.codes || []).filter(function (c) { return c.code !== 'ACTUAL_OVER'; }));

    var html = '';
    for (var d = 1; d <= days; d++) {
      var dateStr = data.yearMonth + '-' + pad2(d);
      var di = dowIndex(dateStr);
      var ps = plan[String(d)] || [];
      var rows = base[String(d)] || [];
      var calcs = (actual.shifts && aev.shifts && aev.shifts[String(d)]) || [];
      html += '<div class="day-card actual-day-card" data-day="' + d + '">';
      html += '<div class="day-header"><div class="day-title-group">';
      html += '<span class="day-num">' + d + '</span>';
      html += '<span class="day-dow">(' + esc((DOW[currentLang] || DOW.ja)[di]) + ')</span>';
      html += '</div></div>';
      html += '<div class="actual-plan-preview"><span>' + esc(t('label.plan')) + ': ' + esc(planText(ps)) + '</span>';
      html += '<button type="button" class="btn-as-planned" data-day="' + d + '">' + esc(t('button.asPlanned')) + '</button></div>';
      html += '<div class="actual-rows">';
      rows.forEach(function (sh, i) { html += shiftRowHtml(d, sh, calcs[i], false, 'actual-shift-row'); });
      html += '</div>';
      html += '<div class="day-card-actions"><button type="button" class="btn-add-row" data-day="' + d + '">＋ ' + esc(t('button.addRow')) + '</button></div>';
      html += '</div>';
    }
    el('actual-table').innerHTML = html;
  }

  function actualStatusText(s) {
    if (s === '予定どおり') return t('label.actualStatus.asPlanned');
    if (s === '修正あり') return t('label.actualStatus.modified');
    return t('label.actualStatus.unconfirmed');
  }

  function planText(list) {
    if (!list.length) return t('label.noPlan');
    return list.map(function (s) {
      var wp = state.workplaces.filter(function (w) { return w.workplaceId === s.workplace; })[0];
      return (wp ? wp.name : '') + ' ' + s.start + '〜' + s.end;
    }).join(' / ');
  }

  // 「予定どおり」: その日の予定のシフトをすべて写す（予定が無い日は空にする）
  el('actual-table').addEventListener('click', function (ev) {
    var btn = ev.target.closest('.btn-as-planned');
    if (!btn) return;
    var day = btn.getAttribute('data-day');
    var ps = (state.monthData.shifts || {})[day] || [];
    var box = btn.closest('.day-card').querySelector('.actual-rows');
    box.innerHTML = ps.map(function (sh) { return shiftRowHtml(day, sh, null, false, 'actual-shift-row'); }).join('');
  });

  el('btn-save-actual').addEventListener('click', function () {
    hideError('actual-error');
    call('api_saveActual', [state.token, state.yearMonth, collectRows('actual-table', 'actual-shift-row'), state.monthData.version]).then(function (res) {
      if (handleSaveResult(res, 'actual-error', 'label.saved')) reloadKeepMessage();
    });
  });

  el('btn-confirm-actual').addEventListener('click', function () {
    hideError('actual-error');
    call('api_confirmActual', [state.token, state.yearMonth, state.monthData.version]).then(function (res) {
      if (handleSaveResult(res, 'actual-error', 'label.confirmedDone')) reloadKeepMessage();
    });
  });

  // ---- 勤務先 ----
  function verificationText(s) {
    if (s === 'OK') return { text: t('label.verificationStatus.approved'), cls: 'badge-confirmed' };
    if (s === '禁止') return { text: t('error.WORKPLACE_BANNED'), cls: 'badge-error' };
    return { text: t('error.WORKPLACE_PENDING'), cls: 'badge-draft' };
  }

  function renderWorkplaces() {
    if (!state.workplaces.length) { el('workplace-list').innerHTML = ''; return; }
    el('workplace-list').innerHTML = state.workplaces.map(function (wp) {
      var v = verificationText(wp.verificationStatus);
      var early = wp.earlyStart && wp.earlyEnd && wp.earlyPremium !== null
        ? '<span>' + esc(wp.earlyStart) + '〜' + esc(wp.earlyEnd) + ' +' + esc(yen(wp.earlyPremium)) + '</span>' : '';
      return '<div class="wp-item-card"><div class="wp-item-top">' +
        '<span class="wp-name">' + esc(wp.name) + '</span><span class="badge ' + v.cls + '">' + esc(v.text) + '</span></div>' +
        '<div class="wp-details"><span>' + esc(wp.prefecture) + '</span><span>' + esc(wp.jobDescription) + '</span>' +
        '<span class="wp-wage-tag">' + esc(t('label.baseHourlyWage')) + ' ' + esc(yen(wp.baseHourlyWage)) + '</span>' + early + '</div></div>';
    }).join('');
  }

  el('wp-pref').innerHTML = '<option value=""></option>' + PREFECTURES.map(function (p) {
    return '<option value="' + esc(p) + '">' + esc(p) + '</option>';
  }).join('');

  el('btn-add-workplace').addEventListener('click', function () { el('workplace-form').hidden = false; });
  el('btn-cancel-workplace').addEventListener('click', function () { el('workplace-form').hidden = true; hideError('wp-error'); });

  el('btn-save-workplace').addEventListener('click', function () {
    hideError('wp-error');
    var premium = el('wp-early-premium').value;
    var wp = {
      name: el('wp-name').value.trim(),
      prefecture: el('wp-pref').value,
      jobDescription: el('wp-job').value.trim(),
      baseHourlyWage: Number(el('wp-wage').value),
      earlyStart: el('wp-early-start').value || null,
      earlyEnd: el('wp-early-end').value || null,
      earlyPremium: premium === '' ? null : Number(premium)
    };
    call('api_saveWorkplace', [state.token, wp]).then(function (res) {
      if (!res.ok) { showError('wp-error', res.error); return; }
      el('workplace-form').hidden = true;
      ['wp-name', 'wp-pref', 'wp-job', 'wp-wage', 'wp-early-start', 'wp-early-end', 'wp-early-premium'].forEach(function (id) { el(id).value = ''; });
      loadStudentMonth();
    });
  });

  // ---- 提出履歴 ----
  function statusText(s) {
    return { '下書き': t('label.status.draft'), '確定済': t('label.status.confirmed'), '学校確定': t('label.status.schoolConfirmed'), '未入力': t('label.status.notEntered') }[s] || s;
  }
  function renderHistory(rows) {
    if (!rows || !rows.length) { el('history-list').innerHTML = ''; return; }

  function openDialog(title, html) {

  // ダイアログ内のボタンは data-act で振り分ける
  var dialogHandlers = {};
  el('admin-dialog-body').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (b && dialogHandlers[b.getAttribute('data-act')]) dialogHandlers[b.getAttribute('data-act')](b);
  });

  // 入力フォーム。fields: [{ key, label, type: text|date|datetime|ym|number|select|bool, options, value, required, hint }]
  function formHtml(fields) {
    return '<div class="admin-form">' + fields.map(function (f) {
      var v = f.value === null || f.value === undefined ? '' : f.value;
      var input;
      if (f.type === 'select') {
        input = '<select data-key="' + esc(f.key) + '">' + f.options.map(function (o) {
          var ov = typeof o === 'object' ? o.value : o, ol = typeof o === 'object' ? o.label : o;
          return '<option value="' + esc(ov) + '"' + (String(ov) === String(v) ? ' selected' : '') + '>' + esc(ol) + '</option>';
        }).join('') + '</select>';
      } else if (f.type === 'bool') {
        input = '<input type="checkbox" data-key="' + esc(f.key) + '"' + (v === true ? ' checked' : '') + '>';
      } else {
        var type = f.type === 'date' ? 'date' : f.type === 'number' ? 'number' : 'text';
        var ph = f.type === 'datetime' ? 'YYYY-MM-DD HH:MM' : f.type === 'ym' ? 'YYYY-MM' : (f.hint || '');
        input = '<input type="' + type + '" data-key="' + esc(f.key) + '" value="' + esc(v) + '" placeholder="' + esc(ph) + '">';
      }
      return '<div class="field"><label>' + esc(f.label) + (f.required ? ' *' : '') + '</label>' + input + '</div>';
    }).join('') + '<p id="admin-form-error" class="error-msg" hidden></p></div>';
  }
  function formValues(fields) {
    var out = {};
    fields.forEach(function (f) {
      var node = el('admin-dialog-body').querySelector('[data-key="' + f.key + '"]');
      if (!node) return;
      if (f.type === 'bool') out[f.key] = node.checked;
      else if (f.type === 'number') out[f.key] = node.value === '' ? null : Number(node.value);
      else out[f.key] = node.value.trim() === '' ? null : node.value.trim();
    });
    return out;
  }
  function openForm(title, fields, submitLabel, onSubmit) {
    openDialog(title, formHtml(fields) +
      '<div class="dialog-actions"><button type="button" class="btn-primary" data-act="submit">' + esc(submitLabel) + '</button></div>');
    dialogHandlers.submit = function () {
      var values = formValues(fields);
      var missing = fields.filter(function (f) { return f.required && (values[f.key] === null || values[f.key] === ''); });
      if (missing.length) { showMsg('admin-form-error', '必須項目: ' + missing.map(function (f) { return f.label; }).join('、'), true); return; }
      onSubmit(values);
    };
  }
  function formError(res) { showMsg('admin-form-error', 'エラー: ' + tErr(res.error), true); }

  // ---- 学生の追加・編集 ----
  function studentFields(s) {
    s = s || {};
    return [
      { key: 'studentId', label: '学籍番号', type: 'text', value: s.studentId, required: true, hint: '例: 251001' },
      { key: 'name', label: '氏名', type: 'text', value: s.name, required: true },
      { key: 'className', label: 'クラス', type: 'text', value: s.className, required: true },
      { key: 'birthDate', label: '生年月日', type: 'date', value: s.birthDate, required: true },
      { key: 'language', label: '言語', type: 'select', value: s.language || 'ja', options: [{ value: 'ja', label: '日本語' }, { value: 'ne', label: 'ネパール語' }, { value: 'vi', label: 'ベトナム語' }] },
      { key: 'enrollmentDate', label: '入学日', type: 'date', value: s.enrollmentDate, required: true },
      { key: 'graduationDate', label: '卒業日', type: 'date', value: s.graduationDate },
      { key: 'withdrawalDate', label: '退学日', type: 'date', value: s.withdrawalDate },
      { key: 'status', label: '在籍状態', type: 'select', value: s.status || '在籍', options: ['在籍', '休学', '卒業', '退学'] },
      { key: 'workPermission', label: '資格外活動許可あり', type: 'bool', value: s.workPermission === true },
      { key: 'permissionExpires', label: '許可期限（在留期限）', type: 'date', value: s.permissionExpires },
      { key: 'permissionCheckedAt', label: '許可確認日', type: 'date', value: s.permissionCheckedAt }
    ];
  }
  function openStudentForm(existing) {
    var fields = studentFields(existing);
    openForm(existing ? '学生情報の編集' : '学生の追加', fields, existing ? '更新' : '追加', function (v) {
      if (existing) v.studentId = existing.studentId;
      call('api_adminUpsertStudent', [state.token, v]).then(function (res) {
        if (!res.ok) { formError(res); return; }
        if (res.data.created) {
          openDialog('ログイン情報（この画面を閉じると二度と表示されません）',
            '<p>学籍番号: <strong>' + esc(res.data.studentId) + '</strong></p><p>ログインID: <strong>' + esc(res.data.loginId) + '</strong></p>' +
            '<p>初期パスワード: <strong>' + esc(res.data.initialPassword) + '</strong></p><p>紙に書いて本人に渡してください。</p>');
        } else {
          openStudentDetail(v.studentId);
        }
        loadAdminBoard();
      });
    });
  }
  el('btn-open-student-form').addEventListener('click', function () { openStudentForm(null); });

      if (!adminAlert(res)) return;
      var d = res.data, s = d.student;
      var html = '<div class="dialog-student-meta"><h2>' + esc(s.name) + '（' + esc(s.studentId) + '）</h2>' +
        '<p>クラス ' + esc(s.className) + ' ／ ' + esc(s.status) + ' ／ 生年月日 ' + esc(s.birthDate) + ' ／ 入学 ' + esc(s.enrollmentDate) +
        (s.graduationDate ? ' ／ 卒業 ' + esc(s.graduationDate) : '') + (s.withdrawalDate ? ' ／ 退学 ' + esc(s.withdrawalDate) : '') + '</p>' +
        '<p>資格外活動許可: ' + (s.workPermission ? 'あり（期限 ' + esc(s.permissionExpires || '未登録') + '）' : 'なし') + ' ／ ログインID ' + esc(s.loginId || '') + '</p></div>';

      html += '<h4>勤務先</h4>';

      d.workplaces.forEach(function (w) {
        html += '<div class="month-row"><div><strong>' + esc(w.name) + '</strong> ' + esc(w.prefecture) + ' ／ ' + esc(w.jobDescription) +

          '<div><button type="button" class="btn-secondary btn-sm" data-act="wpok" data-id="' + esc(w.workplaceId) + '">OK</button> ' +
          '<button type="button" class="btn-danger btn-sm" data-act="wpng" data-id="' + esc(w.workplaceId) + '">禁止</button></div></div>';
      });

      html += '<h4>月ごとの申告</h4><div class="month-row"><div>月を指定: <input type="text" id="detail-ym" value="' + esc(state.yearMonth) + '" placeholder="YYYY-MM"></div>' +
        '<div><button type="button" class="btn-secondary btn-sm" data-act="schoolConfirm">学校確定</button> ' +
        '<button type="button" class="btn-outline btn-sm" data-act="unlock">修正許可</button> ' +
        '<button type="button" class="btn-outline btn-sm" data-act="printMonth">印刷</button></div></div>';
      d.months.forEach(function (m) {
        html += '<div class="month-row"><div><strong>' + esc(m.yearMonth) + '</strong> ' + esc(m.status) + ' ／ 実績 ' + esc(m.actualStatus) + '</div></div>';
      });

      html += '<div class="dialog-actions">' +
        '<button type="button" class="btn-secondary" data-act="edit">学生情報を編集</button>' +
        '<button type="button" class="btn-secondary" data-act="reset">パスワード再発行</button>' +
        '<button type="button" class="btn-outline" data-act="unlockLogin">ロック解除</button>' +
        '<button type="button" class="btn-gold" data-act="print2y">2年間一括印刷</button></div>';

      openDialog('学生詳細', html);
      var ym = function () { return el('detail-ym').value.trim(); };
      var verify = function (status) {
        return function (b) {
          call('api_adminVerifyWorkplace', [state.token, b.getAttribute('data-id'), status]).then(function (r) {
            if (adminAlert(r)) { openStudentDetail(studentId); loadAdminBoard(); }
          });
        };
      };
      dialogHandlers = {
        wpok: verify('OK'),
        wpng: verify('禁止'),
        schoolConfirm: function () {
          if (!confirm(ym() + ' を学校確定（対象外）にします。退学・休学・卒業の学生の未入力の月にだけ使えます。')) return;
          call('api_adminSchoolConfirm', [state.token, studentId, ym()]).then(function (r) {
            if (adminAlert(r, '学校確定しました。')) { openStudentDetail(studentId); loadAdminBoard(); }
          });
        },
        unlock: function () {
          var until = prompt('修正許可の期限（YYYY-MM-DD HH:MM）');
          if (!until) return;
          call('api_adminGrantUnlock', [state.token, studentId, ym(), until.trim()]).then(function (r) {
            if (adminAlert(r, '修正許可を出しました。')) openStudentDetail(studentId);
          });
        },
        printMonth: function () { printPages([studentId], [ym()]); },
        edit: function () { openStudentForm(s); },
        reset: function () {
          if (!confirm('パスワードを再発行します。今のパスワードは使えなくなります。')) return;
          call('api_adminResetPassword', [state.token, studentId]).then(function (r) {
            if (adminAlert(r)) openDialog('再発行したパスワード（この画面を閉じると二度と表示されません）', '<p>ログインID: <strong>' + esc(s.loginId || '') + '</strong></p><p>初期パスワード: <strong>' + esc(r.data.initialPassword) + '</strong></p>');

          call('api_adminUnlockLogin', [state.token, studentId]).then(function (r) { adminAlert(r, 'ロックを解除しました。'); });
        },
        print2y: function () {
          var months = [];
          for (var i = 23; i >= 0; i--) months.push(addMonth(todayYm(), -i));
          printPages([studentId], months);
        }
      };
    });
  }

          html += '<tr' + (row.months.some(function (m) { return m.actualOver; }) ? ' class="actual-over"' : '') + '><td>' + esc(row.studentId) + '</td><td>' + esc(row.name) + '</td>' +
            row.months.map(function (m) {
              return '<td>' + esc(m.actualStatus) + (m.actualTotalMinutes !== null ? ' ' + esc(hm(m.actualTotalMinutes)) : '') + (m.actualOver ? ' <strong>実績超過</strong>' : '') + '</td>';
            }).join('') + '</tr>';
        });
        openDialog('四半期確認 ' + r.data.months[0] + '〜' + r.data.months[2], html + '</tbody></table>');
      });
    });
  });

  // ---- 管理者の追加・保存期限超過の削除 ----
  el('btn-create-admin').addEventListener('click', function () {
    if (!confirm('管理者のアカウントを1つ追加します。')) return;
    call('api_adminCreateAdmin', [state.token]).then(function (res) {
      if (adminAlert(res)) openDialog('新しい管理者（この画面を閉じると二度と表示されません）', '<p>ログインID: <strong>' + esc(res.data.loginId) + '</strong></p><p>初期パスワード: <strong>' + esc(res.data.initialPassword) + '</strong></p>');
    });
  });

  el('btn-purge-expired').addEventListener('click', function () {
    call('api_adminGetSettings', [state.token]).then(function (res) {
      if (!adminAlert(res)) return;
      if (!confirm('保存期間（' + res.data.retentionMonths + 'か月）より前の月の申告データを完全に削除します。元に戻せません。よろしいですか？')) return;
      call('api_adminPurgeExpired', [state.token]).then(function (r) {
        if (adminAlert(r, r.ok ? r.data.deletedRows + '件を削除しました。' : '')) loadAdminBoard();
      });
    });
  });

  // ---- 生徒モード（試用の学生 DEMO の画面に入る。管理者のトークンは手元に残し、「管理者に戻る」で戻す） ----
  var DEMO_PICK = [['DEMO-A', '生徒A（日本語）'], ['DEMO-B', '生徒B（ネパール語）'], ['DEMO-C', '生徒C（ベトナム語）']];
  el('btn-student-mode').addEventListener('click', function () {
    var html = '<p>試用の生徒（クラス DEMO）の画面に入ります。初めてのときは、試用の生徒・勤務先・締切・仮の最低賃金が自動で入ります。</p>';
    DEMO_PICK.forEach(function (d) {
      html += '<p><button data-act="actas" data-id="' + esc(d[0]) + '">' + esc(d[1]) + '</button></p>';
    });
    openDialog('生徒モード', html);
    dialogHandlers.actas = function (b) {
      var studentId = b.getAttribute('data-id');
      call('api_adminActAsDemoStudent', [state.token, studentId]).then(function (res) {
        if (!adminAlert(res)) return;
        closeDialog();
        if (res.data.newStudents.length) {
          var msg = '試用の生徒を作りました。スマホなどから直接ログインするときは次を使ってください（この表示は一度だけです）:\n';
          res.data.newStudents.forEach(function (s) {
            msg += '\n' + s.name + '  ID: ' + s.loginId + '  パスワード: ' + s.initialPassword;
          });
          alert(msg);
        }
        state.adminToken = state.token;
        state.token = res.data.token;
        state.role = 'student';
        state.studentId = res.data.studentId;
        state.yearMonth = todayYm();
        currentLang = res.data.language;
        applyLang();
        el('btn-back-admin').hidden = false;
        showScreen('student-screen');
        loadStudentMonth();
      });
    };
  });
  el('btn-back-admin').addEventListener('click', function () {
    if (!state.adminToken) return;
    callServer('api_logout', [state.token]);
    state.token = state.adminToken;
    state.adminToken = null;
    state.role = 'admin';
    state.studentId = null;
    state.monthData = null; state.workplaces = [];
    el('btn-back-admin').hidden = true;
    afterLogin();
  });

  // ---- 試用データ ----
  el('btn-seed-demo').addEventListener('click', function () {
    if (!confirm('試用データ（クラス DEMO の架空の学生3人・締切・仮の最低賃金）を入れます。本番で使う場合は押さないでください。')) return;
    call('api_adminSeedDemo', [state.token]).then(function (res) {
      if (!adminAlert(res)) return;
      var html = '<p>クラス「DEMO」に入れました。学生のログイン情報（この画面を閉じると二度と表示されません）:</p>';
      if (!res.data.students.length) html += '<p>試用の学生はすでに登録済みです（パスワードを忘れた場合は、学生詳細から再発行してください）。</p>';
      res.data.students.forEach(function (s) {
        html += '<p><strong>' + esc(s.name) + '</strong>（' + esc(s.studentId) + '）ログインID: <strong>' + esc(s.loginId) + '</strong> ／ 初期パスワード: <strong>' + esc(s.initialPassword) + '</strong></p>';
      });
      el('admin-class-filter').value = 'DEMO';
      openDialog('試用データ', html);
      loadAdminBoard();
    });
  });

  // ---- 印刷（50名ずつ。ポップアップを止められないよう、先に窓を開けてから中身を書く） ----
  function printPages(studentIds, months, firstWindow) {
    var chunks = [];
    for (var i = 0; i < studentIds.length; i += 50) chunks.push(studentIds.slice(i, i + 50));
    var windows = chunks.map(function (c, idx) { return idx === 0 && firstWindow ? firstWindow : window.open('', '_blank'); });
    if (windows.some(function (w) { return !w; })) { alert('ポップアップが止められました。ブラウザの設定でこのページのポップアップを許可してください。'); }
    chunks.forEach(function (chunk, idx) {
      call('api_adminPrintHtml', [state.token, { studentIds: chunk, yearMonths: months }]).then(function (r) {
        var w = windows[idx];
        if (!w) return;
        if (!r.ok) { w.close(); alert('エラー: ' + tErr(r.error)); return; }
        w.document.open();
        w.document.write(r.data.html);
        w.document.close();
        w.focus();
        w.print();
      });
    });
  }

  // クラス一括: 絞り込み欄のクラス全員（対象外の学生も「対象外」と印刷する）。
  // 学生一覧の取得を待つ間にポップアップが止められないよう、先に1枚目の窓を開けておく。
  el('btn-print-all-class').addEventListener('click', function () {
    var cls = el('admin-class-filter').value.trim();
    if (!cls) { alert('上の絞り込み欄にクラスを入れてください。'); return; }
    var first = window.open('', '_blank');
    call('api_adminBoard', [state.token, state.yearMonth, { className: cls }]).then(function (res) {
      if (!adminAlert(res)) { if (first) first.close(); return; }
      var sids = res.data.rows.map(function (r) { return r.studentId; });
      if (!sids.length) { if (first) first.close(); alert('印刷する学生がいません。'); return; }
      printPages(sids, [state.yearMonth], first);
    });
  });

  el('btn-print-board').addEventListener('click', function () {
    var sids = state.admin.boardRows.map(function (r) { return r.studentId; });
    if (!sids.length) { alert('表示中の学生がいません。'); return; }
    printPages(sids, [state.yearMonth]);
  });

})();
</script>
