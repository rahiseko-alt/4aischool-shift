<style>
/* ==========================================================================
   4aischool Shift Management System - Stylesheet
   Navy: #1B365D | Gold: #D4AF37 | Surface: #FFFFFF | Canvas: #F4F6FA
   ========================================================================== */

:root {
  --navy: #1B365D;
  --navy-dark: #12243e;
  --navy-light: #2a4e80;
  --navy-subtle: #edf3fa;
  --gold: #D4AF37;
  --gold-hover: #b89528;
  --gold-light: #fdf9ec;
  --gold-border: #f2dfa0;
  --bg: #f4f6fa;
  --surface: #ffffff;
  --text-main: #1e293b;
  --text-sub: #64748b;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --border-focus: #1B365D;
  --success: #059669;
  --success-bg: #ecfdf5;
  --success-border: #a7f3d0;
  --warning: #d97706;
  --warning-bg: #fffbeb;
  --warning-border: #fde68a;
  --danger: #dc2626;
  --danger-bg: #fef2f2;
  --danger-border: #fca5a5;
  --danger-strong: #b91c1c;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --shadow-sm: 0 1px 3px rgba(27, 54, 93, 0.05);
  --shadow-md: 0 4px 14px rgba(27, 54, 93, 0.08);
  --shadow-lg: 0 10px 28px rgba(27, 54, 93, 0.12);
  --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--bg);
  color: var(--text-main);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* --------------------------------------------------------------------------
   Common Components & Typography
   -------------------------------------------------------------------------- */
h1, h2, h3, h4 {
  color: var(--navy);
  font-weight: 700;
  line-height: 1.3;
}

a {
  color: var(--navy);
  text-decoration: none;
}

.card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  padding: 1.25rem;
  margin-bottom: 1.25rem;
  transition: var(--transition);
}

.card:hover {
  box-shadow: var(--shadow-md);
}

.card-title {
  font-size: 1.15rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}

.card-title::before {
  content: "";
  display: inline-block;
  width: 4px;
  height: 1.1em;
  background: var(--gold);
  border-radius: 2px;
}

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.2rem 0.65rem;
  border-radius: 9999px;
  line-height: 1.2;
  white-space: nowrap;
}

.badge-confirmed {
  background: var(--success-bg);
  color: var(--success);
  border: 1px solid var(--success-border);
}

.badge-draft {
  background: var(--warning-bg);
  color: var(--warning);
  border: 1px solid var(--warning-border);
}

.badge-not-submitted {
  background: #f1f5f9;
  color: var(--text-sub);
  border: 1px solid var(--border);
}

.badge-error {
  background: var(--danger-bg);
  color: var(--danger);
  border: 1px solid var(--danger-border);
}

.badge-holiday {
  background: #fee2e2;
  color: var(--danger-strong);
  border: 1px solid #fca5a5;
  font-weight: 700;
}

.badge-out-of-scope {
  background: #f8fafc;
  color: var(--text-muted);
  border: 1px solid var(--border);
}

/* Inputs & Form Elements */
.field {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  margin-bottom: 1rem;
}

.field label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-sub);
}

input[type="text"],
input[type="password"],
input[type="number"],
input[type="time"],
select,
textarea {
  font-family: inherit;
  font-size: 0.95rem;
  color: var(--text-main);
  background: var(--surface);
  border: 1.5px solid #cbd5e1;
  border-radius: var(--radius-md);
  padding: 0.55rem 0.75rem;
  width: 100%;
  outline: none;
  transition: var(--transition);
}

input[type="text"]:focus,
input[type="password"]:focus,
input[type="number"]:focus,
input[type="time"]:focus,
select:focus,
textarea:focus {
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(27, 54, 93, 0.12);
}

input:disabled, select:disabled {
  background: #f1f5f9;
  color: var(--text-muted);
  border-color: var(--border);
  cursor: not-allowed;
}

/* Buttons */
button {
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  padding: 0.5rem 1rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  transition: var(--transition);
}

button:hover {
  transform: translateY(-1px);
}

button:active {
  transform: translateY(0);
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}

.btn-primary {
  background: var(--navy);
  color: #ffffff;
  border: 1px solid var(--navy);
  box-shadow: 0 2px 8px rgba(27, 54, 93, 0.25);
}

.btn-primary:hover:not(:disabled) {
  background: var(--navy-dark);
  box-shadow: 0 4px 12px rgba(27, 54, 93, 0.35);
}

.btn-gold {
  background: var(--gold);
  color: #ffffff;
  border: 1px solid var(--gold);
  box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
}

.btn-gold:hover:not(:disabled) {
  background: var(--gold-hover);
  box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
}

.btn-secondary {
  background: #ffffff;
  color: var(--navy);
  border: 1.5px solid var(--navy);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--navy-subtle);
}

.btn-outline {
  background: transparent;
  color: var(--text-sub);
  border: 1px solid var(--border);
}

.btn-outline:hover:not(:disabled) {
  background: #f1f5f9;
  color: var(--text-main);
  border-color: #cbd5e1;
}

.btn-danger {
  background: var(--danger);
  color: #ffffff;
}

.btn-danger:hover:not(:disabled) {
  background: var(--danger-strong);
}

.btn-sm {
  padding: 0.25rem 0.6rem;
  font-size: 0.8rem;
  border-radius: var(--radius-sm);
}

/* Alert & Notice Bars */
.error-msg {
  color: var(--danger-strong);
  background: var(--danger-bg);
  border: 1px solid var(--danger-border);
  border-radius: var(--radius-md);
  padding: 0.6rem 0.9rem;
  font-size: 0.88rem;
  font-weight: 500;
  margin-top: 0.6rem;
}

.warn-bar {
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  color: #92400e;
  border-radius: var(--radius-md);
  padding: 0.65rem 1rem;
  font-size: 0.9rem;
  font-weight: 600;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.info-bar {
  background: var(--navy-subtle);
  border: 1px solid #d4e2f2;
  color: var(--navy);
  border-radius: var(--radius-md);
  padding: 0.5rem 0.9rem;
  font-size: 0.88rem;
  font-weight: 500;
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* --------------------------------------------------------------------------
   Login & Change Password Screens
   -------------------------------------------------------------------------- */
#login-screen, #change-password-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  background: linear-gradient(135deg, #12243e 0%, #1B365D 60%, #2a4e80 100%);
  position: relative;
}

.login-lang-bar {
  position: absolute;
  top: 1.25rem;
  right: 1.25rem;
  display: flex;
  gap: 0.4rem;
}

.login-card {
  width: 100%;
  max-width: 420px;
  background: var(--surface);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  padding: 2.25rem 2rem;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.login-brand {
  text-align: center;
  margin-bottom: 1.75rem;
}

.login-emblem {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 52px;
  height: 52px;
  background: linear-gradient(135deg, var(--navy) 0%, #2a4e80 100%);
  color: var(--gold);
  border-radius: 14px;
  font-size: 1.5rem;
  font-weight: 800;
  box-shadow: 0 4px 12px rgba(27, 54, 93, 0.25);
  margin-bottom: 0.75rem;
  border: 2px solid var(--gold);
}

#app-title {
  font-size: 1.35rem;
  color: var(--navy);
  margin-bottom: 0.25rem;
}

.login-subtitle {
  font-size: 0.85rem;
  color: var(--text-sub);
}

/* --------------------------------------------------------------------------
   Top Navigation Bars (Student & Admin)
   -------------------------------------------------------------------------- */
.top-bar {
  background: var(--navy);
  color: #ffffff;
  padding: 0.75rem 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow-md);
  border-bottom: 2px solid var(--gold);
  position: sticky;
  top: 0;
  z-index: 50;
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.brand-logo-mark {
  background: var(--gold);
  color: var(--navy);
  font-weight: 800;
  font-size: 0.95rem;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand-name {
  font-size: 1rem;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 0.02em;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.user-badge {
  font-size: 0.85rem;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.12);
  padding: 0.3rem 0.65rem;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255, 255, 255, 0.2);
}

/* Language Switcher */
.lang-switch {
  display: inline-flex;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 20px;
  padding: 3px;
  gap: 2px;
}

.lang-switch button {
  background: transparent;
  color: rgba(255, 255, 255, 0.8);
  border: none;
  font-size: 0.8rem;
  padding: 0.25rem 0.65rem;
  border-radius: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}

.lang-switch button:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.1);
  transform: none;
}

.lang-switch button.active {
  background: var(--gold);
  color: var(--navy-dark);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
}

/* --------------------------------------------------------------------------
   Student Screen Layout
   -------------------------------------------------------------------------- */
.student-content {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem 1rem;
}

/* Month Navigation Bar */
.month-hero {
  background: linear-gradient(135deg, var(--navy) 0%, #254b7c 100%);
  color: #ffffff;
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.25rem;
  box-shadow: var(--shadow-md);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  border-left: 5px solid var(--gold);
}

.month-nav {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.month-nav-title {
  font-size: 1.4rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  min-width: 140px;
  text-align: center;
}

.month-nav button {
  background: rgba(255, 255, 255, 0.15);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.3);
  width: 2.25rem;
  height: 2.25rem;
  padding: 0;
  font-size: 1.1rem;
  border-radius: 50%;
}

.month-nav button:hover {
  background: var(--gold);
  color: var(--navy);
  border-color: var(--gold);
}

.deadline-pill {
  font-size: 0.85rem;
  font-weight: 600;
  background: rgba(0, 0, 0, 0.25);
  padding: 0.35rem 0.85rem;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}

/* 1日1行の予定表（紙の予定表と同じ形: 日付(曜日) | 開始〜終了 | 休憩 | 実働） */
.shift-table-wrap {
  margin-bottom: 1rem;
}

.shift-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 0.85rem;
}

.shift-table th,
.shift-table td {
  border-bottom: 1px solid var(--border);
  padding: 0.3rem 0.25rem;
  text-align: center;
  vertical-align: middle;
}

.shift-table thead th {
  background: var(--navy-subtle);
  color: var(--navy);
  font-size: 0.72rem;
  font-weight: 700;
  line-height: 1.25;
}

.shift-table .col-date { width: 3.2rem; }
.shift-table .col-break { width: 3.1rem; }
.shift-table .col-work { width: 4.4rem; }

.shift-table td.col-date {
  text-align: left;
  white-space: nowrap;
  line-height: 1.2;
}

.shift-table .day-num {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--navy);
}

.shift-table .day-dow {
  font-size: 0.75rem;
  font-weight: 700;
}

.dow-sun { color: var(--danger); }
.dow-sat { color: #2563eb; }
.dow-weekday { color: var(--text-sub); }

.shift-table tr.dow-sun td.col-date { background: #fff5f5; }
.shift-table tr.dow-sat td.col-date { background: #eff6ff; }

/* 長期休暇の日: 行全体に色を付け、日付の下に印 */
.shift-table tr.holiday-day td {
  background: #fff1f2;
}
.shift-table tr.holiday-day td.col-date {
  border-left: 3px solid var(--danger);
}
.hol-mark {
  display: block;
  margin-top: 0.15rem;
  padding: 0.05rem 0.2rem;
  font-size: 0.58rem;
  white-space: normal;
  text-align: center;
}

/* エラーのある日: その日の行の下にコードを出す */
.shift-table tr.has-codes td {
  border-bottom: none;
}
.shift-table tr.day-codes-row td {
  padding-top: 0;
  text-align: left;
}
.shift-table tr.day-codes-row .codes-bar {
  margin: 0 0 0.2rem 0;
}

.time-pair {
  display: flex;
  align-items: center;
  gap: 0.15rem;
}

.shift-table .time-pair input {
  flex: 1 1 0;
  min-width: 0;
  width: 100%;
  padding: 0.3rem 0.2rem;
  font-size: 1rem; /* 16px 未満だと iPhone が入力時に画面を拡大する */
  text-align: center;
}

.shift-row-sep {
  color: var(--text-muted);
  font-weight: bold;
}

.shift-table td.cell-break,
.shift-table td.cell-work {
  font-size: 0.78rem;
  color: var(--text-main);
  line-height: 1.2;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.shift-table td.cell-work {
  font-weight: 700;
  color: var(--navy);
}

.shift-table tfoot td.month-total {
  text-align: right;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--navy);
  background: var(--gold-light);
  border-top: 2px solid var(--gold);
  border-bottom: none;
  padding: 0.6rem 0.5rem;
}

/* 実績表: 予定の表示と「予定どおり」ボタン */
.plan-hint {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.2rem;
  margin-top: 0.2rem;
  font-size: 0.7rem;
  color: var(--text-sub);
  text-align: left;
}

.btn-as-planned {
  background: var(--gold);
  color: #ffffff;
  font-size: 0.7rem;
  padding: 0.1rem 0.4rem;
  border-radius: var(--radius-sm);
}

/* スマホ（幅 480px 以下）: 余白を詰め、時刻欄の時計の印を隠して幅を確保する */
@media (max-width: 480px) {
  .top-bar {
    flex-wrap: wrap;
    gap: 0.5rem;
    padding: 0.6rem 0.75rem;
  }
  .user-info {
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .student-content {
    padding-left: 0.5rem;
    padding-right: 0.5rem;
  }
  .shift-card {
    padding: 0.75rem 0.4rem;
  }
  .shift-table .time-pair input {
    padding: 0.3rem 0.1rem;
  }
}

/* Shift Actions Bottom Bar */
.actions-card {
  position: sticky;
  bottom: 1rem;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(8px);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 0.85rem 1.25rem;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.75rem;
  z-index: 40;
}

.actions-buttons {
  display: flex;
  gap: 0.6rem;
}

/* History List */
.history-table {
  width: 100%;
  border-collapse: collapse;
}

.history-table th, .history-table td {
  padding: 0.6rem 0.75rem;
  text-align: left;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
}

.history-table th {
  background: #f8fafc;
  font-weight: 600;
  color: var(--text-sub);
}

/* --------------------------------------------------------------------------
   管理画面（上の細い帯＋1列。カードを大きくしない）
   -------------------------------------------------------------------------- */
.adm-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.5rem 1rem;
  background: var(--navy);
  color: #ffffff;
  border-bottom: 3px solid var(--gold);
}
.adm-brand {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 700;
  font-size: 0.95rem;
  white-space: nowrap;
}
.adm-month { margin: 0 auto; }
.adm-month .month-nav-title { color: #ffffff; font-size: 1.1rem; }
.adm-month button { color: #ffffff; border: none; background: transparent; box-shadow: none; width: auto; }
.adm-logout { color: #ffffff; border-color: rgba(255,255,255,0.4); background: transparent; border-radius: 3px; white-space: nowrap; width: auto; }

.adm-main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0.75rem 1rem 2rem;
}

.adm-counts {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem 1.25rem;
  margin-bottom: 0.6rem;
  padding: 0.4rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.88rem;
  color: var(--text-sub);
}
.adm-stat { color: var(--text-sub); text-decoration: none; white-space: nowrap; }
.adm-stat strong { color: var(--text-main); font-weight: 700; }
a.adm-stat:hover { color: var(--navy); text-decoration: underline; }
a.adm-stat.is-active { color: var(--navy); text-decoration: underline; font-weight: 600; }
.adm-stat.stat-error strong { color: var(--danger); }
.adm-stat.stat-warn strong { color: var(--warning); }

.adm-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  align-items: center;
  margin-bottom: 0.6rem;
}
.adm-toolbar input, .adm-toolbar select {
  width: auto;
  border-radius: 3px;
  flex: 1 1 8rem;
  padding: 0.4rem 0.6rem;
  font-size: 0.9rem;
}
.adm-toolbar button { flex: 0 0 auto; }

.adm-table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  overflow-x: auto;
  margin-bottom: 1rem;
}
.admin-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}
.admin-table th {
  text-align: left;
  padding: 0.45rem 0.6rem;
  background: #f8fafc;
  color: var(--text-sub);
  font-weight: 600;
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
.admin-table td {
  padding: 0.4rem 0.6rem;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.admin-table tbody tr.board-row { cursor: pointer; }
.admin-table tbody tr.board-row:hover td { background: var(--navy-subtle); }
.admin-table tr.actual-over td { background: var(--danger-bg); }
.admin-table td.nowrap { white-space: nowrap; }

.history-hint { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 0.4rem; }
.history-table tr.history-row { cursor: pointer; }
.history-table tr.history-row:hover td { background: var(--navy-subtle); }
.ph-name { display: block; font-size: 0.65rem; color: var(--danger); line-height: 1.2; white-space: nowrap; }
