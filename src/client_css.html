  --navy: #1B365D;
  --navy-dark: #12243e;
  --navy-light: #2a4e80;
  --navy-subtle: #edf3fa;
  --gold: #D4AF37;
  --gold-hover: #b89528;
  --gold-light: #fdf9ec;
  --gold-border: #f2dfa0;
  --bg: #f4f6fa;
  --surface: #ffffff;
  --text-main: #1e293b;
  --text-sub: #64748b;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --border-focus: #1B365D;
  --success: #059669;
  --success-bg: #ecfdf5;
  --success-border: #a7f3d0;
  --warning: #d97706;
  --warning-bg: #fffbeb;
  --warning-border: #fde68a;
  --danger: #dc2626;
  --danger-bg: #fef2f2;
  --danger-border: #fca5a5;
  --danger-strong: #b91c1c;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --shadow-sm: 0 1px 3px rgba(27, 54, 93, 0.05);
  --shadow-md: 0 4px 14px rgba(27, 54, 93, 0.08);
  --shadow-lg: 0 10px 28px rgba(27, 54, 93, 0.12);
  --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%; /* iPhone を横にしたときに文字が勝手に大きくならないように */
  text-size-adjust: 100%;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background-color: var(--bg);
  color: var(--text-main);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* --------------------------------------------------------------------------
   Common Components & Typography
   -------------------------------------------------------------------------- */
h1, h2, h3, h4 {
  color: var(--navy);
  font-weight: 700;
  line-height: 1.3;
}

a {
  color: var(--navy);
  text-decoration: none;
}

.card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  padding: 1.25rem;
  margin-bottom: 1.25rem;
  transition: var(--transition);
}

.card:hover {
  box-shadow: var(--shadow-md);
}

.card-title {
  font-size: 1.15rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}

.card-title::before {
  content: "";
  display: inline-block;
  width: 4px;
  height: 1.1em;
  background: var(--gold);
  border-radius: 2px;
}

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.2rem 0.65rem;
  border-radius: 9999px;
  line-height: 1.2;
  white-space: nowrap;
}

.badge-confirmed {
  background: var(--success-bg);
  color: var(--success);
  border: 1px solid var(--success-border);
}

.badge-draft {
  background: var(--warning-bg);
  color: var(--warning);
  border: 1px solid var(--warning-border);
}

.badge-not-submitted {
  background: #f1f5f9;
  color: var(--text-sub);
  border: 1px solid var(--border);
}

.badge-error {
  background: var(--danger-bg);
  color: var(--danger);
  border: 1px solid var(--danger-border);
}

.badge-holiday {
  background: #fee2e2;
  color: var(--danger-strong);
  border: 1px solid #fca5a5;
  font-weight: 700;
}

.badge-out-of-scope {
  background: #f8fafc;
  color: var(--text-muted);
  border: 1px solid var(--border);
}

/* Inputs & Form Elements */
.field {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  margin-bottom: 1rem;
}

.field label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-sub);
}

input[type="text"],
input[type="password"],
input[type="number"],
input[type="time"],
input[type="date"],
input[type="month"],
select,
textarea {
  font-family: inherit;
  font-size: 0.95rem;
  color: var(--text-main);
  background: var(--surface);
  border: 1.5px solid #cbd5e1;
  border-radius: var(--radius-md);
  padding: 0.55rem 0.75rem;
  width: 100%;
  outline: none;
  transition: var(--transition);
}

input[type="text"]:focus,
input[type="password"]:focus,
input[type="number"]:focus,
input[type="time"]:focus,
input[type="date"]:focus,
input[type="month"]:focus,
select:focus,
textarea:focus {
  border-color: var(--navy);
  box-shadow: 0 0 0 3px rgba(27, 54, 93, 0.12);
}

input:disabled, select:disabled {
  background: #f1f5f9;
  color: var(--text-muted);
  border-color: var(--border);
  cursor: not-allowed;
}

/* Buttons */
button {
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  padding: 0.5rem 1rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  transition: var(--transition);
}

button:hover {
  transform: translateY(-1px);
}

button:active {
  transform: translateY(0);
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}

.btn-primary {
  background: var(--navy);
  color: #ffffff;
  border: 1px solid var(--navy);
  box-shadow: 0 2px 8px rgba(27, 54, 93, 0.25);
}

.btn-primary:hover:not(:disabled) {
  background: var(--navy-dark);
  box-shadow: 0 4px 12px rgba(27, 54, 93, 0.35);
}

.btn-gold {
  background: var(--gold);
  color: #ffffff;
  border: 1px solid var(--gold);
  box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
}

.btn-gold:hover:not(:disabled) {
  background: var(--gold-hover);
  box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
}

.btn-secondary {
  background: #ffffff;
  color: var(--navy);
  border: 1.5px solid var(--navy);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--navy-subtle);
}

.btn-outline {
  background: transparent;
  color: var(--text-sub);
  border: 1px solid var(--border);
}

.btn-outline:hover:not(:disabled) {
  background: #f1f5f9;
  color: var(--text-main);
  border-color: #cbd5e1;
}

.btn-danger {
  background: var(--danger);
  color: #ffffff;
}

.btn-danger:hover:not(:disabled) {
  background: var(--danger-strong);
}

.btn-sm {
  padding: 0.25rem 0.6rem;
  font-size: 0.8rem;
  border-radius: var(--radius-sm);
}

/* Alert & Notice Bars */
.error-msg {
  color: var(--danger-strong);
  background: var(--danger-bg);
  border: 1px solid var(--danger-border);
  border-radius: var(--radius-md);
  padding: 0.6rem 0.9rem;
  font-size: 0.88rem;
  font-weight: 500;
  margin-top: 0.6rem;
}

.warn-bar {
  background: var(--warning-bg);
  border: 1px solid var(--warning-border);
  color: #92400e;
  border-radius: var(--radius-md);
  padding: 0.65rem 1rem;
  font-size: 0.9rem;
  font-weight: 600;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.info-bar {
  background: var(--navy-subtle);
  border: 1px solid #d4e2f2;
  color: var(--navy);
  border-radius: var(--radius-md);
  padding: 0.5rem 0.9rem;
  font-size: 0.88rem;
  font-weight: 500;
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* --------------------------------------------------------------------------
   Login & Change Password Screens
   -------------------------------------------------------------------------- */
#login-screen, #change-password-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  background: linear-gradient(135deg, #12243e 0%, #1B365D 60%, #2a4e80 100%);
  position: relative;
}

.login-lang-bar {
  position: absolute;
  top: 1.25rem;
  right: 1.25rem;
  display: flex;
  gap: 0.4rem;
}

.login-card {
  width: 100%;
  max-width: 420px;
  background: var(--surface);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  padding: 2.25rem 2rem;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.login-brand {
  text-align: center;
  margin-bottom: 1.75rem;
}

.login-emblem {
  display: inline-block;
  width: 64px;
  height: 64px;
  margin-bottom: 0.75rem;
  background: var(--app-logo) center / contain no-repeat;
  font-size: 0; /* 文字は読み上げ用。見た目はロゴの画像 */
}

#app-title {
  font-size: 1.35rem;
  color: var(--navy);
  margin-bottom: 0.25rem;
}

.login-subtitle {
  font-size: 0.85rem;
  color: var(--text-sub);
}

/* --------------------------------------------------------------------------
   Top Navigation Bars (Student & Admin)
   -------------------------------------------------------------------------- */
.top-bar {
  background: var(--navy);
  color: #ffffff;
  padding: 0.75rem 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow-md);
  border-bottom: 2px solid var(--gold);
  position: sticky;
  top: 0;
  z-index: 50;
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.brand-logo-mark {
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
  background: var(--app-logo) center / contain no-repeat;
  font-size: 0;
}

.brand-name {
  font-size: 1rem;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 0.02em;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.user-badge {
  font-size: 0.85rem;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.12);
  padding: 0.3rem 0.65rem;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255, 255, 255, 0.2);
}

/* Language Switcher */
.lang-select {
  width: auto;
  padding: 0.3rem 0.5rem;
  font-size: 0.9rem;
  border-radius: 3px;
}

.lang-switch {
  display: inline-flex;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 20px;
  padding: 3px;
  gap: 2px;
}

.lang-switch button {
  background: transparent;
  color: rgba(255, 255, 255, 0.8);
  border: none;
  font-size: 0.8rem;
  padding: 0.25rem 0.65rem;
  border-radius: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}

.lang-switch button:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.1);
  transform: none;
}

.lang-switch button.active {
  background: var(--gold);
  color: var(--navy-dark);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
}

/* --------------------------------------------------------------------------
   Student Screen Layout
   -------------------------------------------------------------------------- */
.student-content {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem 1rem;
}

/* Month Navigation Bar */
.month-hero {
  background: linear-gradient(135deg, var(--navy) 0%, #254b7c 100%);
  color: #ffffff;
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.25rem;
  box-shadow: var(--shadow-md);
  display: flex;
  flex-wrap: wrap;
