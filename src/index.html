<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include_('client_css') ?>
</head>
<body>
<div id="app">
  <div id="login-screen">
    <h1 id="app-title">アルバイト申告</h1>
    <div class="card login-card">
      <div class="field">
        <label id="lbl-loginId">ログインID</label>
        <input type="text" id="inp-loginId" autocomplete="username">
      </div>
      <div class="field">
        <label id="lbl-password">パスワード</label>
        <input type="password" id="inp-password" autocomplete="current-password">
      </div>
      <p id="login-error" class="error-msg" hidden></p>
      <button id="btn-login" class="btn-primary">ログイン</button>
    </div>
  </div>

  <div id="change-password-screen" hidden>
    <div class="card">
      <h2 id="lbl-change-password-title">パスワードを変更してください</h2>
      <div class="field">
        <label id="lbl-cur-password">現在のパスワード</label>
        <input type="password" id="inp-cur-password">
      </div>
      <div class="field">
        <label id="lbl-new-password">新しいパスワード</label>
        <input type="password" id="inp-new-password">
      </div>
      <p id="change-password-error" class="error-msg" hidden></p>
      <button id="btn-change-password" class="btn-primary">変更</button>
    </div>
  </div>

  <div id="student-screen" hidden>
    <header class="top-bar">
      <div class="lang-switch">
        <button data-lang="ja">日本語</button>
        <button data-lang="ne">नेपाली</button>
        <button data-lang="vi">Tiếng Việt</button>
      </div>
      <div class="user-info">
        <span id="st-name"></span>
        <button id="btn-logout-st">ログアウト</button>
      </div>
    </header>
    <div class="content">
      <div class="month-nav">
        <span id="st-year-month"></span>
        <button id="btn-prev-month">&lt;</button>
        <button id="btn-next-month">&gt;</button>
      </div>
      <div id="st-deadline-info" class="info-bar"></div>
      <div id="st-closed-notice" class="warn-bar" hidden></div>

      <section id="workplaces-section">
        <h2 id="lbl-workplace">勤務先</h2>
        <div id="workplace-list"></div>
        <button id="btn-add-workplace">勤務先を追加</button>
        <div id="workplace-form" hidden>
          <div class="card">
            <div class="field"><label>名前</label><input type="text" id="wp-name"></div>
            <div class="field"><label>都道府県</label><input type="text" id="wp-pref"></div>
            <div class="field"><label>仕事内容</label><input type="text" id="wp-job"></div>
            <div class="field"><label>時給（円）</label><input type="number" id="wp-wage" min="1"></div>
            <div class="field">
              <label>早朝手当（任意）</label>
              <input type="time" id="wp-early-start" step="900" placeholder="開始">
              <input type="time" id="wp-early-end" step="900" placeholder="終了">
              <input type="number" id="wp-early-premium" min="0" placeholder="手当額/時">
            </div>
            <p id="wp-error" class="error-msg" hidden></p>
            <button id="btn-save-workplace">保存</button>
            <button id="btn-cancel-workplace">キャンセル</button>
          </div>
        </div>
      </section>

      <section id="shifts-section">
        <h2>シフト予定</h2>
        <div id="shifts-table"></div>
        <div id="shift-actions">
          <button id="btn-save-draft">途中保存</button>
          <button id="btn-confirm-shift">確定</button>
        </div>
        <p id="shift-error" class="error-msg" hidden></p>
      </section>

      <section id="actual-section" hidden>
        <h2>実績確認</h2>
        <div id="actual-table"></div>
        <button id="btn-save-actual">実績を保存</button>
        <button id="btn-confirm-actual">実績を確定</button>
        <p id="actual-error" class="error-msg" hidden></p>
      </section>

      <section id="history-section">
        <h2 id="lbl-history">提出履歴</h2>
        <div id="history-list"></div>
      </section>
    </div>
  </div>

  <div id="admin-screen" hidden>
    <header class="top-bar admin-bar">
      <span class="admin-title">管理画面</span>
      <button id="btn-logout-admin">ログアウト</button>
    </header>
    <div class="content">
      <div class="month-nav">
        <span id="admin-year-month"></span>
        <button id="btn-admin-prev-month">&lt;</button>
        <button id="btn-admin-next-month">&gt;</button>
      </div>

      <div class="filter-bar">
        <input type="text" id="admin-class-filter" placeholder="クラス">
        <select id="admin-status-filter">
          <option value="">全状態</option>
          <option value="確定済">確定済</option>
          <option value="下書き">下書き</option>
          <option value="未提出">未提出</option>
          <option value="対象外">対象外</option>
        </select>
        <input type="text" id="admin-query" placeholder="学籍番号・氏名">
        <button id="btn-admin-search">検索</button>
      </div>

      <div id="admin-counts" class="counts-bar"></div>
      <div id="admin-board"></div>

      <details class="settings-section">
        <summary>マスタ設定</summary>
        <div class="setting-group">
          <button id="btn-open-student-form">学生を追加・更新</button>
          <button id="btn-open-deadline">締切設定</button>
          <button id="btn-open-holiday">長期休業設定</button>
          <button id="btn-open-wage">最低賃金設定</button>
          <button id="btn-open-settings">学校設定</button>
          <button id="btn-create-admin">管理者を追加</button>
          <button id="btn-purge-expired">保存期限超過データを削除</button>
          <button id="btn-print-all-class">クラス一括印刷</button>
          <button id="btn-print-board">表示中を一括印刷</button>
        </div>
      </details>

      <div id="admin-dialog-overlay" hidden>
        <div class="admin-dialog card">
          <div id="admin-dialog-body"></div>
          <button id="btn-dialog-close">閉じる</button>
        </div>
      </div>
    </div>
  </div>

  <div id="global-spinner" hidden>
    <div class="spinner-inner">処理中…</div>
  </div>
</div>

</body>
</html>
