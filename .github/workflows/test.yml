name: test

# 実装役はこのファイルを変更してはならない。
# 変更禁止のファイルの指紋一覧（test/LOCKED.sha256）自体の指紋を、ここに直接書いている。
# テストは package.json を通さず、node --test で全部を実行する。

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 指紋一覧そのものが渡した時のままか
        run: echo "87c198d70b4aa105e33e3944a0552717ee8f06015e4bb9437c88ce7e598406be  test/LOCKED.sha256" | sha256sum -c
      - name: 変更禁止のファイルが渡した時のままか
        run: sh scripts/check-locked.sh
      - name: テスト（src/ ができてから実行する）
        run: |
          if [ -d src ]; then
            node --test "test/**/*.test.js"
          else
            echo "src/ がまだ無いため、テストは実行しない（実装前）"
          fi
